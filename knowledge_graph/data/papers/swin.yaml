      evidence: "Our Swin-L model with ImageNet-22K pre-training achieves 53.5 mIoU on the val set, surpassing the previous best model by +3.2 mIoU (50.3 mIoU by SETR which has a larger model size)."
      source: "paper-reading-notes/2026/08/swin-paper/精读笔记/03_实验与消融.md"
      confidence: high
