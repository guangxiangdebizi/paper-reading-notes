      evidence: "when applied to the CLIP [27] model with ViT-B/16 architecture, our method achieves a substantial increase in mIoU"
      source: "paper-reading-notes/2026/08/last-vit/精读笔记/04_实验与结论.md"
      confidence: high
    - to: metaclip
      rel_type: USES_AS_TOOL
