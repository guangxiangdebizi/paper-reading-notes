  problems:
    - id: vit_data_hunger
      description: "ViT 好结果依赖私有 JFT-300M（3 亿张图）+ 大型基础设施（千 TPU-core-day 级），'thereby limiting their adoption'，公众无法复现"
      source: "paper-reading-notes/2026/08/deit-paper/精读笔记/01_摘要与引言.md"
    - id: transformer_soft_distill_ineffective
