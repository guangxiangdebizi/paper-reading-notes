paper:
  id: transformer
  title: "Attention Is All You Need"
  aliases: ["Transformer"]
  authors: "Vaswani, Shazeer, Parmar, Uszkoreit, Jones, Gomez, Kaiser, Polosukhin"
  affiliation: "Google Brain / Google Research / University of Toronto"
  year: 2017
  venue: "NIPS 2017"
  arxiv: "1706.03762"
  status: "已读"
  notes_path: "paper-reading-notes/2026/08/transformer-paper/精读笔记"
  source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/README.md"
  problem: |
    主导的序列转换模型基于复杂的循环或卷积网络：RNN 的 hₜ = f(hₜ₋₁, xₜ) 形成串行依赖链，"这种固有的顺序性质阻碍了训练样本内部的并行化"，分解技巧与条件计算都治标不治本；attention 一次就能关联任意距离的两个位置，但 2017 年年中它只是挂在 RNN/CNN 主干上的外挂配件。本文做跨越：去掉主干，只留 attention。
  contributions:
    - "提出 Transformer：完全基于注意力机制、彻底省去循环与卷积的序列转换架构——N=6 层 encoder（self-attention + position-wise FFN 两子层）+ N=6 层 decoder（masked self-attention + cross-attention + FFN 三子层），全模型统一宽度 d_model=512，每个子层残差连接 + LayerNorm（02_背景与模型架构.md）"
    - "缩放点积注意力（Noam Shazeer 提出）：Attention(Q,K,V) = softmax(QKᵀ/√d_k)·V，除以 √d_k 的方差论证见脚注 4；多头注意力 h=8、每头 d_k=d_v=64，补偿单头加权平均的分辨率损失且总计算量与全维单头相近（02_背景与模型架构.md）"
    - "注意力三用法：encoder self-attention（QKV 同源、无 mask）/ decoder masked self-attention（遮挡未来、配合输出右移一位保证自回归）/ encoder-decoder cross-attention（Q 来自 decoder、KV 来自 encoder）（02_背景与模型架构.md）"
    - "正弦位置编码（无参数位置表示）：波长 2π 到 10000·2π 几何级数，相对位置可线性表示，可能支持长度外推；与可学习位置 embedding 精度几乎相同（02_背景与模型架构.md）"
    - "§4 用三条标准（每层复杂度 / 最少串行操作数 / 路径长度）论证 self-attention 相对循环与卷积的优势：串行步数 O(1)、路径长度 O(1)（02_背景与模型架构.md）"
    - "WMT 2014 英德/英法双 SOTA 与泛化验证：成分句法分析在缺乏任务特化调参下'表现出乎意料地好'， Transformer 从翻译模型升格为通用序列转换架构（01/03/04）"
  limitations:
    - "self-attention 每层复杂度 O(n²·d)，对长序列昂贵；优势区间被划定为序列不长于表示维度（n < d 时才比 RNN 的 O(n·d²) 便宜）——预告了长序列场景需要改进（02_背景与模型架构.md）"
    - "(B) 行自我批评：减小 d_k 掉点提示'确定相容性并不容易'，比点积更复杂的相容性函数可能有益（03_训练设置与实验结果.md）"
    - "头数过多也掉点：h=16 开始下降，多头收益与每头维度之间存在权衡，8×64 是当时的最优平衡（03_训练设置与实验结果.md）"
  key_results:
    - "WMT 2014 EN-DE 28.4 BLEU（big 模型），比包括集成在内的现有最佳结果高出 2.0 以上；base 27.3 也已超过所有此前已发表模型与集成——单模型赢集成说明优势来自架构本身而非算力堆叠（01_摘要与引言.md / 03_训练设置与实验结果.md）"
    - "WMT 2014 EN-FR 41.8 BLEU（Table 2 记载；正文写作 41.0 系笔误，笔记注明以 Table 2 为准），新单模型 SOTA，训练成本不到前 SOTA 的 1/4（03_训练设置与实验结果.md）"
    - "训练成本：单机 8×P100，base 0.4s/步 × 100K 步 = 12 小时、big 1.0s/步 × 300K 步 = 3.5 天；FLOPs（base 3.3×10¹⁸ / big 2.3×10¹⁹）比此前竞争模型低一到两个数量级（03_训练设置与实验结果.md）"
    - "泛化（成分句法分析，4 层、d_model=1024、几乎未调参）：半监督 92.7 F1 超所有此前半监督模型；WSJ only 40K 句 91.3 F1，超过 BerkeleyParser（90.4），与 Dyer et al. 91.7 几乎持平（04_泛化实验_结论与附录精华.md）"
    - "消融 Table 3：单头注意力比最佳设置差 0.9 BLEU（多头必要性）；正弦位置编码 vs 可学习位置 embedding 几乎相同（25.7 vs 25.8）；dropout 极关键（P_drop=0 时显著掉点）；更大模型更好（03_训练设置与实验结果.md）"
  concepts:
    - id: scaled_dot_product_attention
      name: "缩放点积注意力（Scaled Dot-Product Attention）"
      detail: "Attention(Q, K, V) = softmax(QKᵀ/√d_k)·V：任意两位置的相关性一次矩阵乘同时算完；除以 √d_k 的理由（脚注 4）：q·k 点积均值 0、方差 d_k，不缩放会把 softmax 推入梯度极小区域；相容性函数选点积而非加性注意力是因为硬件亲和度最高（可用高度优化的矩阵乘实现）"
      origin: "本文（Noam Shazeer 提出）"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: multi_head_attention
      name: "多头注意力（Multi-Head Attention）"
      detail: "MultiHead(Q,K,V) = Concat(head₁,...,head_h)W^O：把 d_model 拆成 h=8 个低维子空间（每头 d_k=d_v=64）各做一次注意力再拼接；动机是补偿单头加权平均造成的有效分辨率损失，每头维度降低使总计算量与全维单头相近——'在不加算力的前提下换来的表达能力'"
      origin: "本文（Noam Shazeer 提出）"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: attention_three_usages
      name: "注意力的三种用法"
      detail: "同一个注意力公式按 QKV 来源分三种角色：encoder self-attention（QKV 同源、无 mask）/ decoder masked self-attention（mask 置 −∞ 遮挡未来 + 输出右移一位，二者合取保证自回归）/ encoder-decoder cross-attention（Q 与 KV 异源）"
      origin: "本文"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: position_wise_ffn
      name: "Position-wise FFN"
      detail: "FFN(x) = max(0, xW₁+b₁)W₂+b₂：对每个位置独立且相同地施加、无跨位置交互；512→2048→512（d_ff = 4×d_model）先升后降；'等价于两个 kernel size 为 1 的卷积'；4 倍扩张比被后续几乎所有工作沿用"
      origin: "本文"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: sinusoidal_positional_encoding
      name: "正弦位置编码"
      detail: "偶数维 sin、奇数维 cos，波长构成 2π 到 10000·2π 的几何级数；以加法注入 embedding；选它的两个理由：对任意偏移 k，PE_{pos+k} 可表示为 PE_pos 的线性函数（相对位置可学习），且可能支持外推到比训练更长的序列（'may allow'）；与可学习版精度几乎相同"
      origin: "本文（Noam Shazeer 提出）"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: embedding_weight_sharing
      name: "三处权重共享 + embedding 乘 √d_model"
      detail: "输入 embedding、输出 embedding 与 pre-softmax 线性变换共享同一权重矩阵；embedding 层权重乘以 √d_model，使幅度与 ±1 之间的正弦位置编码匹配、位置信息不被淹没"
      origin: "本文"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: self_attention_desiderata
      name: "self-attention 三条标准（§4）"
      detail: "每层总计算复杂度（O(n²·d)）、可并行计算量（最少串行操作数，self-attention O(1) vs RNN O(n)）、长程依赖路径长度（O(1) vs RNN O(n)、卷积 O(log_k n)）；n < d 时 self-attention 比 RNN 更便宜；restricted self-attention 行（O(r·n·d)）预示后续稀疏/局部/窗口注意力"
      origin: "本文"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
  depends:
    - id: bahdanau_attention
      name: "Bahdanau 加性注意力"
      detail: "对比对象：相容性函数用单隐层前馈网络；理论复杂度与点积注意力相当，但实践中点积 much faster and more space-efficient（可用优化矩阵乘实现）"
      origin: "Bahdanau et al. 2015 [2]"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: bytenet
      name: "ByteNet"
      detail: "以卷积为基本构件的并行前作：所有位置并行计算，但远距离位置关联所需操作数随距离对数增长——并行 ≠ 任意两位置直连"
      origin: "ByteNet [18]"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: convs2s
      name: "ConvS2S"
      detail: "卷积翻译路线前作：远距离位置关联操作数随距离线性增长；Transformer 的直接对标对手（Table 2 中 ConvS2S Ensemble 41.29 等）"
      origin: "ConvS2S [9]"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: end_to_end_memory_network
      name: "端到端记忆网络"
      detail: "最接近的先例：基于循环注意力机制而非与序列对齐的循环；差别在于 Transformer 连记忆读写循环都没有，纯靠前馈 + 注意力一次算完"
      origin: "End-to-end memory networks [34]"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: layernorm
      name: "LayerNorm"
      detail: "每个子层输出 LayerNorm(x + Sublayer(x))（post-norm 顺序）；稳定每层输入分布（引文 [1]，Ba et al.）"
      origin: "Ba et al. [1]"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
    - id: adam
      name: "Adam 优化器"
      detail: "β₁=0.9、β₂=0.98、ε=10⁻⁹；外层配 warmup 4000 步线性升 + 之后按步数平方根倒数衰减的学习率调度（公式 (3)），该组合成为此后几乎所有 Transformer 训练的默认配方"
      origin: "Kingma & Ba [20]"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/03_训练设置与实验结果.md"
    - id: bpe
      name: "字节对编码（BPE）"
      detail: "英德方向用 BPE 子词切分、源-目标共享词表约 37000 token；解决稀有词问题；英法用 word-piece 词表 32000"
      origin: "Sennrich et al. [3]"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/03_训练设置与实验结果.md"
    - id: label_smoothing
      name: "Label Smoothing"
      detail: "ε_ls=0.1：'损害困惑度，但提升准确率与 BLEU 分数'——牺牲拟合换泛化的经典权衡，ViT/DeiT/ConvNeXt/MAE 配方表中一脉相承"
      origin: "Szegedy et al. [36]"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/03_训练设置与实验结果.md"
    - id: gnmt
      name: "GNMT"
      detail: "推理实现细节的出处：checkpoint 平均（base 最后 5 个 / big 最后 20 个，每 10 分钟写一次）、beam search beam=4 与长度惩罚 α=0.6 均引自 [38]"
      origin: "GNMT [38]"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/03_训练设置与实验结果.md"
  datasets:
    - name: "WMT 2014 EN-DE"
      scale: "约 450 万句对"
      role: "train+eval"
      metrics: "big 28.4 BLEU / base 27.3 BLEU（03_训练设置与实验结果.md）"
    - name: "WMT 2014 EN-FR"
      scale: "3600 万句"
      role: "train+eval"
      metrics: "big 41.8 BLEU（03_训练设置与实验结果.md）"
    - name: "Penn Treebank (WSJ)"
      scale: "约 40K 训练句"
      role: "eval"
      metrics: "成分句法分析 WSJ 23 F1：WSJ only 91.3（04_泛化实验_结论与附录精华.md）"
    - name: "high-confidence + BerkleyParser corpora"
      scale: "约 1700 万句"
      role: "pretrain"
      metrics: "半监督设置 92.7 F1（04_泛化实验_结论与附录精华.md）"
  problems:
    - id: rnn_serial_computation
      description: "RNN 隐藏状态 hₜ 依赖 hₜ₋₁ 形成串行依赖链，阻碍训练样本内部的并行化，序列越长越严重；分解技巧与条件计算均无法消除这一结构层面的根本约束"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/01_摘要与引言.md"
  relates:
    - to: detr
      rel_type: PROVIDES_RECIPE
      detail: "encoder/decoder 完整定义与 cross-attention 的原型出处：decoder 第三子层（Q 来自 decoder 前一子层、KV 来自 encoder 堆输出）是 DETR 的 decoder 的直接原型"
      evidence: "这就是 §3.2.3 的第一种用法'encoder-decoder attention'，也是 DETR 的 decoder、MAE 的轻量 decoder 的直接原型"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
      confidence: high
    - to: mae
      rel_type: INSPIRES
      detail: "encoder/decoder、self-attention、multi-head、positional encoding 等一切表述的原版出处；摘要'泛化到其他任务'的尾注在事后看是整个 Transformer 时代的序章——ViT/MAE 做的正是这句话在视觉领域的放大"
      evidence: "这个'架构能迁移到别的任务'的尾注，在事后看是整个 Transformer 时代的序章——ViT/DETR/MAE 做的正是这句话在视觉领域的放大"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/01_摘要与引言.md"
      confidence: high
    - to: vit
      rel_type: INSPIRES
      detail: "Table 3 行 (E) 正弦位置编码与可学习位置 embedding 几乎相同（25.7 vs 25.8）的结论，使 ViT 敢直接用可学习位置 embedding"
      evidence: "(E) 是位置编码的可替换性证据：正弦版与可学习版几乎相同——这解释了为什么 ViT 敢直接用可学习位置 embedding（ViT 的选择即溯源于本行的结论）"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/03_训练设置与实验结果.md"
      confidence: high
    - to: swin
      rel_type: INSPIRES
      detail: "§4 Table 1 的 restricted self-attention 一行（只关注大小 r 的邻域、复杂度 O(r·n·d)），正是后来 Sparse/Local Attention、Swin 窗口注意力等一系工作的源头句"
      evidence: "原文说 'We plan to investigate this approach further in future work'——这正是后来 Sparse/Local Attention、Swin 的窗口注意力等一系工作的源头句"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
      confidence: high
    - to: resnet
      rel_type: BORROWS
      detail: "残差连接借自 ResNet（引文 [11] 即 He et al.）：每个子层外使用残差连接，让梯度可以直达底层；只取'跳连'这一结构思想"
      evidence: "We employ a residual connection [11] around each of the two sub-layers, followed by layer normalization"
      source: "paper-reading-notes/2026/08/transformer-paper/精读笔记/02_背景与模型架构.md"
      confidence: high
  belongs_to:
    - topic: t_classic_foundation
      order: 1
      source: "paper-reading-notes/经典地基阅读路线图.md"
