      description: "光流四大天敌（快速移动物体、遮挡、运动模糊、无纹理表面）；手工设计优化目标难以鲁棒覆盖各种角落情况"
      source: "paper-reading-notes/2026/08/raft-paper/精读笔记/01_摘要与引言.md"
