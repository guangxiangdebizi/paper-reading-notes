    source: "paper-reading-notes/经典地基阅读路线图.md"

  - id: t_vmsv2
    name: "vmsv2 motion trail 课题"
    kind: branch
    description: "课题：视频QA中把运动信息压缩成更少更有结构的视觉证据（motion trail keyframes），主后端 Qwen3-VL-8B；含时间模板/光流双流/动态图/帧采样/视觉标注/工具/评测/gate 技术/LoRA-PEFT 工具层"
    source: "vmsv2/docs/literature-map.md"

  - id: t_optical_flow_family
    name: "光流家族"
    kind: family
