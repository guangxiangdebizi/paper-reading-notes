    source: "paper-reading-notes/ViT家族拓展阅读路线图.md"
  - id: t_distill_family
    name: "蒸馏压缩家族"
    kind: family
    description: "知识蒸馏与小模型压缩流派：Hinton蒸馏、Born-Again、DistilBERT、MiniLM"
    source: "paper-reading-notes/小模型vs大模型阅读链路.md"
  - id: t_scalinglaw_family
